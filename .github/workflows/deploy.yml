name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || (github.ref == 'refs/heads/master' && 'prod' || github.ref_name) }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Configure these environments in GitHub → Settings → Environments.
    # "production" should require reviewers; "preview" should use a
    # preview-scoped Cloudflare token. Deploy code is PR-controlled, so an
    # unreviewed same-repo branch must never receive the production token.
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Prepare stage-scoped secrets
        env:
          IS_PROD: ${{ env.STAGE == 'prod' }}
          PROD_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            echo "STAGE_BETTER_AUTH_SECRET=$PROD_AUTH_SECRET" >> "$GITHUB_ENV"
          else
            # Ephemeral per-deploy signing key: preview workers can never
            # leak or reuse the production session secret.
            echo "STAGE_BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          fi

      - name: Warn when previews use the production Cloudflare token
        if: env.STAGE != 'prod'
        env:
          PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          if [ -z "$PREVIEW_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PREVIEW_API_TOKEN is not set — preview deploys are using the production Cloudflare token. Add a preview-scoped token so PR code cannot reach production resources."
          fi

      - name: Deploy with Alchemy
        run: bun --cwd packages/infra alchemy deploy --stage ${{ env.STAGE }} --yes
        env:
          # CI mode: alchemy resolves credentials purely from env vars (no
          # ~/.alchemy profile), and the state-store login reads its token
          # from the account Secrets Store via a short-lived edge-preview
          # Worker on every run. GitHub normally sets CI=true, but we pin it
          # so the mode never depends on runner defaults.
          CI: "true"
          # Prefer a preview-scoped token for non-prod stages; fall back to
          # the prod token only so existing deployments keep working. Add
          # CLOUDFLARE_PREVIEW_API_TOKEN to remove the fallback.
          CLOUDFLARE_API_TOKEN: ${{ env.STAGE == 'prod' && secrets.CLOUDFLARE_API_TOKEN || (secrets.CLOUDFLARE_PREVIEW_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN) }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ env.STAGE_BETTER_AUTH_SECRET }}
          # Comma-separated bootstrap admins. Kept out of source; set the
          # GitHub secret to the owner's verified address(es). Production
          # only: a preview must never receive the real admin roster.
          ADMIN_EMAILS: ${{ env.STAGE == 'prod' && secrets.ADMIN_EMAILS || '' }}
          # Production-only integrations: previews deploy with these empty so
          # PR code can never touch live payment, email, or identity
          # credentials (or production data — previews get their own
          # stage-suffixed D1 database and R2 bucket).
          RESEND_API_KEY: ${{ env.STAGE == 'prod' && secrets.RESEND_API_KEY || '' }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ env.STAGE == 'prod' && secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ env.STAGE == 'prod' && secrets.GOOGLE_CLIENT_SECRET || '' }}
          STRIPE_SECRET_KEY: ${{ env.STAGE == 'prod' && secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_PUBLISHABLE_KEY: ${{ env.STAGE == 'prod' && secrets.STRIPE_PUBLISHABLE_KEY || '' }}
          STRIPE_WEBHOOK_SECRET: ${{ env.STAGE == 'prod' && secrets.STRIPE_WEBHOOK_SECRET || '' }}
          SHIPPO_API_KEY: ${{ env.STAGE == 'prod' && secrets.SHIPPO_API_KEY || '' }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const stage = process.env.STAGE;
            const url = `https://${stage}.sweettreatslr.com`;
            const issue_number = context.issue.number;
            const commentBody = `### 🍦 Preview Deployment Ready!\n\n**Preview URL:** [${url}](${url})\n**Stage:** \`${stage}\`\n**Commit:** \`${context.sha.slice(0, 7)}\``;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const existing = comments.data.find(c => c.body && c.body.includes('Preview Deployment Ready!'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: commentBody
              });
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Safety Check
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi

      - name: Destroy Preview Environment
        run: bun --cwd packages/infra alchemy destroy --stage ${{ env.STAGE }} --yes
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Destroy only reads state; no production secret is ever needed here.
          BETTER_AUTH_SECRET: destroy-only-placeholder-not-a-real-secret
          PULL_REQUEST: ${{ github.event.number }}
